name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate generated files match templates
        run: node scripts/generate.js all --config defaults/config.json --dry-run

      - name: Run generator tests
        run: zsh ./tests/test-generate.sh

      - name: Run tools merge tests
        run: zsh ./tests/test-tools.sh

      - name: Run install tests
        run: zsh ./tests/test-install.sh

      - name: Run migrate-config tests
        run: zsh ./tests/test-migrate-config.sh

      - name: Run CLI contract tests
        run: node scripts/test-cli-contract.js

      - name: Run skill validation
        run: zsh ./tests/validate-skills.sh
